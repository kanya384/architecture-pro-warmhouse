version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smarthome-network

  devices-db:
    image: postgres:16-alpine
    container_name: devices-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devices
    ports:
      - "5432:5432"
    networks:
      - smarthome-network

  telemetry-db:
    image: postgres:16-alpine
    container_name: telemetry-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature
      dockerfile: Dockerfile
    container_name: temperature-api
    environment:
      - SERVER_PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  devices:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: devices
    environment:
      - SERVER_PORT=8082
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry
    environment:
      - SERVER_PORT=8083
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@smarthome-postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge